<template>
    <lightning-card title="contact Info" icon-name="standard-record">
        <div class="slds-m-around_medium">
            <template if:true={contact.data}>
                <lightning-input label="Id" disabled value={contact.data.Id}></lightning-input>
                <lightning-input label="FirstName" data-field="FirstName" value={contact.data.FirstName}></lightning-input>
                <lightning-input label="LastName" data-field="LastName" value={contact.data.LastName}></lightning-input>
                <lightning-button label="update Contact" onclick={handleClick}></lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
