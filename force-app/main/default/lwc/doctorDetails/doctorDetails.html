<template>
    <div class="slds-box" style="background-color :blue">
       <template if:true={allDoc}>
        <div class="slds-grid slds-wrap slds-gutters">
            <template for:each={allDoc} for:item="doc">
                <div class="slds-col slds-size_1-of-3 slds-p-around_small" key={doc.Id}>
                    <lightning-card title={doc.Name}>
                        <lightning-button variant="success" label="Details" slot="actions"></lightning-button>
                        <p class="slds-p-around_small">{doc.doc_Mobileno__c}</p>
                        <p class="slds-p-around_small">{doc.Doc_Email__c}</p>
                        <p slot ="footer">{doc.Doctor_Specialist__c}</p>
                    </lightning-card>            
                  </div>
            </template>
        </div>
       </template>
    </div>
</template>
